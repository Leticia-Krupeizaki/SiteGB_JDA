# Publica o site estático no GitHub Pages a cada push na main.
# Configuração do repositório e do domínio: docs/DEPLOY-GITHUB-PAGES.md
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; a que estiver no meio termina antes da próxima.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Domínio do site: entra no HTML gerado (SEO, Open Graph, sitemap).
  SITE_URL: https://gbjardimdasamericas.com.br

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
          NEXT_TELEMETRY_DISABLED: 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
