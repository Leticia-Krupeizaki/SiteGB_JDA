# Infraestrutura LOCAL para desenvolver o mural (Etapa 4).
# Em produção, banco e storage são serviços gerenciados (ver .env.example).
# Subir: docker compose up -d   ·   criar buckets: npm run storage:init
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sitegb
      POSTGRES_PASSWORD: sitegb
      POSTGRES_DB: sitegb
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

  # Storage compatível com S3 (SeaweedFS). Bucket privado para originais,
  # bucket público só para derivados de fotos aprovadas.
  storage:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '8333:8333'
    volumes:
      - storage-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  db-data:
  storage-data:
