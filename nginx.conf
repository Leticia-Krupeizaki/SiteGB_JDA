# Servidor do site estático (pasta out/ do `npm run build`).
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Redirecionamentos relativos: o nginx não conhece o domínio público (fica atrás do proxy do Coolify).
    absolute_redirect off;

    # /professores → professores.html; /professores/ → /professores.
    rewrite ^(.+)/$ $1 permanent;
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;

    # Arquivos do build com hash no nome: nunca mudam, cache longo.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Fotos do mural e demais arquivos de public/: cache de um dia.
    location ~* \.(webp|jpe?g|png|svg|ico|woff2)$ {
        try_files $uri =404;
        expires 1d;
    }

    location = /llms.txt {
        default_type text/markdown;
        charset utf-8;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/markdown application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}
