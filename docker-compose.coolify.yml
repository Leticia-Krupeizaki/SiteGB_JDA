# Deploy no Coolify (build pack "Docker Compose"). Guia: docs/DEPLOY-COOLIFY.md
#
# Site estático: um único serviço (nginx servindo os arquivos gerados no build).
# SERVICE_URL_APP é o domínio definido no Coolify para o serviço `app`.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${SERVICE_URL_APP}
    environment:
      - SERVICE_URL_APP_3000
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
